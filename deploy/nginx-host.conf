# nginx на хосте → контейнер с сайтом.
# Ставится в /etc/nginx/sites-available/ganin и включается симлинком.
server {
    listen 80;
    server_name a318f7177847.vps.myjino.ru;

    client_max_body_size 20M;      # запас под резюме (форма ограничена 10 МБ)

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1000;

    location /static/ {
        alias /opt/ganin/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /opt/ganin/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # HTTPS терминируется на стороне Jino, поэтому протокол фиксируем явно
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
    }
}
