# nginx на хосте → контейнер с сайтом (ganin-group.ru).
# Ставится в /etc/nginx/sites-available/ganin и включается симлинком.
#
# Блоков три:
#   1) основной — обслуживает ТОЛЬКО ganin-group.ru;
#   2) www — отдаёт 301 на канонический домен. Без него сайт доступен
#      в двух копиях, и поисковики делят между ними вес ссылок;
#   3) :80 — сразу на https канонического домена, одним переходом.
#
# Строки с сертификатами добавляет certbot; при первом выпуске он их
# подставит сам, при переносе конфига — проверить пути.

server {
    listen 443 ssl;
    server_name ganin-group.ru;

    ssl_certificate /etc/letsencrypt/live/ganin-group.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ganin-group.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;      # запас под резюме (форма ограничена 10 МБ)

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1000;

    location /static/ {
        alias /opt/ganin/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /opt/ganin/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Протокол — из X-Forwarded-Proto прокси хостинга, иначе схема соединения
        # (карта $ganin_fwd_proto лежит в /etc/nginx/conf.d/ganin-proto.conf)
        proxy_set_header X-Forwarded-Proto $ganin_fwd_proto;
        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
    }
}

# www → без www: склейка доменов
server {
    listen 443 ssl;
    server_name www.ganin-group.ru;

    ssl_certificate /etc/letsencrypt/live/ganin-group.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ganin-group.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://ganin-group.ru$request_uri;
}

# http → https канонического домена, одним переходом
server {
    listen 80;
    server_name ganin-group.ru www.ganin-group.ru;

    # окно для проверки домена при продлении сертификата
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://ganin-group.ru$request_uri; }
}
