<div class="modal" id="tkp">
  <div class="modal-card">
    <a class="x" href="#top">✕</a>
    <h3>Запросить ТКП</h3>
    {% if messages %}<div style="margin-top:14px">{% for m in messages %}<p style="font-size:13px;color:var(--accent);margin-top:6px">{{ m }}</p>{% endfor %}</div>{% endif %}
    <form method="post" action="{% url 'lead_create' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.path }}" />
      <label class="f-label" for="tkp-name">Имя *</label>
      <input class="f-input" id="tkp-name" name="name" placeholder="Как к вам обращаться" required />
      <label class="f-label" for="tkp-phone">Телефон *</label>
      <input class="f-input" id="tkp-phone" name="phone" placeholder="+7 ___ ___-__-__" required />
      <label class="f-label" for="tkp-company">Компания</label>
      <input class="f-input" id="tkp-company" name="company" />
      <label class="f-label" for="tkp-details">Объект / объём / сроки</label>
      <textarea class="f-input" id="tkp-details" name="details" placeholder="Например: ЖК, 12 000 м³, старт в марте"></textarea>
      <label class="f-agree"><input type="checkbox" name="agree" checked /> <span>Согласен на обработку персональных данных — <a href="{% url 'consent' %}">текст согласия</a></span></label>
      <button class="btn btn--solid" type="submit" style="width:100%;margin-top:22px">Отправить заявку</button>
    </form>
  </div>
</div>
<div class="modal" id="tkp-ok">
  <div class="modal-card" style="text-align:center">
    <a class="x" href="#top">✕</a>
    <h3 style="margin-top:8px">Заявка отправлена</h3>
    <p style="color:var(--muted);margin-top:12px;font-size:14.5px">Менеджер направления свяжется с вами в рабочее время.</p>
    <a class="btn btn--line" href="#top" style="margin-top:24px">Закрыть</a>
  </div>
</div>
